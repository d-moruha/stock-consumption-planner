# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Pack build outputs
      run: |
        find src tests tools -type d \( -name bin -o -name obj \) -print0 |
          tar --null -czf build-outputs.tar.gz --files-from=-
    - name: Upload build outputs
      uses: actions/upload-artifact@v4
      with:
        name: build-outputs
        path: build-outputs.tar.gz
        if-no-files-found: error
        retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Download build outputs
      uses: actions/download-artifact@v4
      with:
        name: build-outputs
    - name: Unpack build outputs
      run: tar -xzf build-outputs.tar.gz
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Test
      run: dotnet test --no-build --no-restore --verbosity normal
